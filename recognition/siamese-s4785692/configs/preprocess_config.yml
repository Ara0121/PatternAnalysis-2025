# ============================================================
# preprocess_config.yml
#
# Configuration file for ISIC dataset preprocessing, training,
# and evaluation. Defines dataset paths, split ratios, model
# parameters, training hyperparameters, and output directories.
#
# Author: Sohtaroh Arakawa
# Created: 2025-10-28
# ============================================================

# Source Data Configuration
source:
  image_dir: "./data/original/image"
  csv_file: "./data/original/train-metadata.csv"
  image_extension: ".jpg"

# Output Configuration
output:
  base_dir: "./data/processed"

# Split Configuration
splits:
  train_ratio: 0.7
  val_ratio: 0.15
  random_seed: 42
  stratify: true # Stratify by target class to maintain class balance
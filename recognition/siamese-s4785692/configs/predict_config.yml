# ============================================================
# predict_config.yaml
#
# Configuration file for predicting a single image.
# Defines image path, model path, and threshold settings.
#
# Author: Sohtaroh Arakawa
# Created: 2025-10-29
# ============================================================

# Prediction settings
predict:
  image_path: "./data/original/image/ISIC_0015719.jpg"
  checkpoint: "./model/best_model.pth"
  threshold: 0.498

# Data Augmentation Configuration
augmentation:
  # NOTE: ImageNet base normalization values
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Model Configuration
model:
  embedding_dim: 256
  pretrained: true

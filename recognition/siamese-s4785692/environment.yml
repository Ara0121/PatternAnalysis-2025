# ============================================================
# environment.yml
#
# Conda environment specification for the Siamese-ISIC project.
# Includes required python version and packages.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate siamese-isic
#
# Author: Sohtaroh Arakawa
# Created: 2025-10-28
# ============================================================

name: siamese-isic
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy
      - pandas
      - pillow
      - matplotlib
      - scikit-learn
      - tqdm
      - pyyaml
      - torch
      - torchvision